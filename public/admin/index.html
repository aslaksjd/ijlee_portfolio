<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 — 콘텐츠 편집</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<header class="admin-topbar">
  <span class="topbar-name">관리자</span>
  <a class="admin-back" href="../">사이트로 돌아가기</a>
</header>

<nav class="admin-tabs" role="tablist" aria-label="편집 메뉴">
  <button type="button" role="tab" data-tab="settings">GitHub 설정</button>
  <button type="button" role="tab" data-tab="about">About Me</button>
  <button type="button" role="tab" data-tab="project">Project</button>
  <button type="button" role="tab" data-tab="ai">AI Utilization</button>
</nav>

<main class="admin-main">

  <section class="admin-card" id="settings-card" data-pane="settings">
    <h2>GitHub 연결 설정</h2>
    <p class="admin-hint">
      이 설정은 이 브라우저에만 저장됩니다(서버로 전송되지 않음). Personal Access Token은
      이 저장소에 대해 <code>Contents: Read and write</code> 권한(fine-grained) 또는
      <code>repo</code> 스코프(classic)가 있어야 커밋이 가능합니다.
    </p>
    <div class="admin-grid">
      <label>저장소 (owner/repo)
        <input id="set-project" type="text" placeholder="octocat/my-portfolio">
      </label>
      <label>브랜치
        <input id="set-branch" type="text" placeholder="main">
      </label>
      <label>Personal Access Token
        <input id="set-token" type="password" placeholder="github_pat_xxxxxxxxxxxx">
      </label>
    </div>
    <div class="admin-actions">
      <button id="btn-save-settings" class="btn btn-primary" type="button">설정 저장</button>
      <button id="btn-load-content" class="btn" type="button">저장소에서 불러오기</button>
      <button id="btn-clear-token" class="btn btn-ghost" type="button">토큰 지우기</button>
    </div>
    <p id="settings-status" class="admin-status"></p>
  </section>

  <section class="admin-card" data-pane="about">
    <h2>About</h2>
    <div class="admin-grid" id="about-form">
      <label>이름 <input data-field="name" type="text"></label>
      <label>생년월일 <input data-field="birth" type="text" placeholder="1990.01.01"></label>
      <label>주소 <input data-field="address" type="text" placeholder="서울특별시 ○○구"></label>
      <label>이메일 <input data-field="email" type="email"></label>
    </div>

    <div class="row-group">
      <div class="admin-card-head">
        <h3>자격사항</h3>
        <button id="btn-add-certification" class="btn btn-sm" type="button">+ 자격 추가</button>
      </div>
      <div id="certification-editor"></div>
    </div>

    <div class="row-group">
      <div class="admin-card-head">
        <h3>학력</h3>
        <button id="btn-add-education" class="btn btn-sm" type="button">+ 학력 추가</button>
      </div>
      <div id="education-editor"></div>
    </div>

    <div class="row-group">
      <div class="admin-card-head">
        <h3>경력</h3>
        <button id="btn-add-career" class="btn btn-sm" type="button">+ 경력 추가</button>
      </div>
      <div id="career-editor"></div>
    </div>
  </section>

  <section class="admin-card" data-pane="about">
    <h2>Hero (메인 화면 문구)</h2>
    <div class="admin-grid" id="profile-form">
      <label>직함 <input data-field="role" type="text"></label>
      <label>이름 <input data-field="name" type="text"></label>
      <label class="span-2">헤드라인 <input data-field="headline" type="text"></label>
      <label class="span-2">서브 헤드라인 <input data-field="subhead" type="text"></label>
    </div>
    <label class="field-block">프로필 사진 교체
      <input id="profile-photo-input" type="file" accept="image/*">
    </label>
    <p class="admin-hint">업로드하면 <code>assets/img/profile/me.jpg</code> 로 저장됩니다.</p>
  </section>

  <section class="admin-card" data-pane="project">
    <div class="admin-card-head">
      <h2>Changelog (경력)</h2>
      <button id="btn-add-changelog" class="btn" type="button">항목 추가</button>
    </div>
    <div id="changelog-editor"></div>
  </section>

  <section class="admin-card" data-pane="ai">
    <div class="admin-card-head">
      <h2>AI Skill</h2>
      <button id="btn-add-skill" class="btn" type="button">항목 추가</button>
    </div>
    <div id="skill-editor"></div>
  </section>

  <div class="admin-savebar">
    <span id="save-status" class="admin-status"></span>
    <button id="btn-copy-json" class="btn btn-ghost" type="button">content.json 복사</button>
    <button id="btn-save-all" class="btn btn-primary" type="button">변경사항 저장 (커밋)</button>
  </div>

</main>

<script src="admin.js"></script>
<script>
(function () {
  var tabs = document.querySelectorAll(".admin-tabs [data-tab]");
  var panes = document.querySelectorAll("[data-pane]");
  function select(name) {
    tabs.forEach(function (t) {
      var on = t.dataset.tab === name;
      t.classList.toggle("is-active", on);
      t.setAttribute("aria-selected", on ? "true" : "false");
    });
    panes.forEach(function (p) { p.hidden = p.dataset.pane !== name; });
    try { sessionStorage.setItem("admin-tab", name); } catch (e) {}
  }
  tabs.forEach(function (t) { t.addEventListener("click", function () { select(t.dataset.tab); }); });
  var saved = null;
  try { saved = sessionStorage.getItem("admin-tab"); } catch (e) {}
  select(saved && document.querySelector('[data-tab="' + saved + '"]') ? saved : "about");
})();
</script>
</body>
</html>
